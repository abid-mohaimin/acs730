name: lab3-deploy

# Plan on every pull request to main. Apply only when a change lands on main.
on:
  pull_request:
    branches: [main]
    paths:
      - "lab3/**"
      - ".github/workflows/lab3-deploy.yml"
  push:
    branches: [main]
    paths:
      - "lab3/**"
      - ".github/workflows/lab3-deploy.yml"
  workflow_dispatch:

# One Terraform run at a time against the shared state. A second run waits
# in the queue instead of cancelling one that might be halfway through apply.
concurrency:
  group: lab3-terraform
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform plan / apply
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab3
    env:
      TF_IN_AUTOMATION: "true"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # Session-scoped AWS Academy credentials, refreshed every lab session
      # by scripts/refresh-gha-creds.sh. They expire when the session ends.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Show who we are
        run: aws sts get-caller-identity

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.3
          terraform_wrapper: false

      - name: terraform init (S3 backend)
        run: terraform init -input=false

      - name: terraform validate
        run: terraform validate

      - name: terraform plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: terraform apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -input=false -auto-approve tfplan
